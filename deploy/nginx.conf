# ============================================================
# Binglish — Configuración Nginx para Producción (Linux)
# ============================================================
# Instrucciones:
#   1. Copiar este archivo a /etc/nginx/sites-available/binglish
#   2. Crear symlink: sudo ln -s /etc/nginx/sites-available/binglish /etc/nginx/sites-enabled/
#   3. Verificar sintaxis: sudo nginx -t
#   4. Recargar: sudo systemctl reload nginx
#
# Ajustar las rutas marcadas con [CAMBIAR] según tu servidor.
# ============================================================

server {
    listen 80;
    server_name tu-dominio.com;  # [CAMBIAR] tu dominio o IP pública

    # ── Frontend (Archivos Estáticos) ──
    root /var/www/binglish/frontend;  # [CAMBIAR] ruta absoluta a tu carpeta frontend
    index index.html;

    # Quitar .html de las URLs automáticamente
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cacheo de assets estáticos (CSS, JS, imágenes, fuentes)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Backend API (Proxy Reverso a Uvicorn) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para backups grandes
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ── Seguridad Básica ──
    # Ocultar versión de Nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Logs
    access_log /var/log/nginx/binglish_access.log;
    error_log  /var/log/nginx/binglish_error.log;
}

# ============================================================
# (Opcional) Redirección HTTPS con Certbot
# ============================================================
# Después de instalar el certificado SSL con:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tu-dominio.com
#
# Certbot modificará este archivo automáticamente para añadir
# la redirección HTTP → HTTPS y los bloques ssl.
# ============================================================
